<div class="flex flex-col items-center justify-center w-full">
<div class="w-full flex justify-center mb-space-md">
<span class="font-headline-display text-[32px] font-extrabold tracking-tight text-primary">Pyla</span>
</div>
<p class="font-body-default text-body-default text-on-surface-variant text-center -mt-space-xs mb-space-md">
      Inteligência financeira em compras de mercado
    </p>
<!-- Seletor de Modo (Abas) -->
<div class="w-full grid grid-cols-2 p-1 bg-surface-container rounded-lg mb-space-md">
<button aria-selected="true" class="py-2.5 px-space-xs text-center font-body-bold text-body-bold transition-all rounded text-on-primary bg-primary-container shadow-sm cursor-pointer focus-visible:outline focus-visible:outline-3 focus-visible:outline-tertiary-fixed-dim" id="tab-login-btn" onclick="switchAuthMode('login')" type="button">
        Entrar
      </button>
<button aria-selected="false" class="py-2.5 px-space-xs text-center font-body-medium text-body-medium transition-all rounded text-on-surface-variant hover:text-on-surface cursor-pointer focus-visible:outline focus-visible:outline-3 focus-visible:outline-tertiary-fixed-dim" id="tab-register-btn" onclick="if (window.navigateToScreen) { navigateToScreen('{{DATA:SCREEN:SCREEN_6}}'); } else { window.location.href='#criar-conta'; }" type="button" data-screen="{{DATA:SCREEN:SCREEN_6}}">
        Criar conta
      </button>
</div>
<!-- Feedback Alerta de Erro Visual -->
<div class="w-full mb-space-sm p-3 bg-error-container text-on-error-container rounded flex items-start gap-2 hidden transition-all" id="error-alert" role="alert">
<span aria-hidden="true" class="material-symbols-outlined text-[20px] text-error flex-shrink-0 mt-0.5">error</span>
<div class="flex flex-col">
<span class="font-body-bold text-label-caption-bold text-error">Erro de autenticação</span>
<span class="font-body-default text-label-caption text-error">E-mail ou senha inválidos. Verifique seus dados e tente novamente.</span>
</div>
</div>
<!-- FORMULÁRIO DE LOGIN (Entrar) -->
<form class="w-full flex flex-col gap-space-sm" id="form-login" onsubmit="event.preventDefault(); if (window.navigateToScreen) { navigateToScreen('{{DATA:SCREEN:SCREEN_24}}'); } else { window.location.href='#resumo-do-mes'; }" data-screen="{{DATA:SCREEN:SCREEN_24}}">
<div class="flex flex-col gap-1">
<label class="font-body-medium text-label-caption-bold text-on-surface" for="login-email">
          E-mail
        </label>
<div class="relative">
<input autocomplete="email" class="w-full h-11 px-3 bg-surface-container-lowest text-on-surface rounded placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-tertiary-fixed-dim bg-transparent" id="login-email" name="email" placeholder="seu@email.com" required="" style="box-shadow: inset 0 0 0 1px #c3c4d2;" type="email">
</div>
</div>
<div class="flex flex-col gap-1">
<label class="font-body-medium text-label-caption-bold text-on-surface" for="login-password">
            Senha
          </label>
<div class="relative flex items-center">
<input autocomplete="current-password" class="w-full h-11 pl-3 pr-10 bg-surface-container-lowest text-on-surface rounded placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-tertiary-fixed-dim" id="login-password" name="password" placeholder="••••••••" required="" style="box-shadow: inset 0 0 0 1px #c3c4d2;" type="password">
<button aria-label="Alternar visibilidade da senha" class="absolute right-2 p-1 text-on-surface-variant hover:text-on-surface cursor-pointer rounded" onclick="togglePasswordVisibility('login-password', 'login-pwd-icon')" type="button">
<span class="material-symbols-outlined text-[20px]" id="login-pwd-icon">visibility</span>
</button>
</div>
</div>
<button class="w-full min-h-[44px] mt-1 bg-primary-container hover:bg-primary text-on-primary font-body-bold text-body-bold rounded flex items-center justify-center transition-colors cursor-pointer shadow-sm active:scale-[0.99]" type="submit">
        Entrar
      </button>
<div class="flex items-center justify-center gap-1.5 pt-2 text-center">
<span class="font-body-default text-label-caption text-on-surface-variant">Não tem uma conta?</span>
<button class="font-body-bold text-label-caption-bold text-primary hover:underline cursor-pointer" onclick="if (window.navigateToScreen) { navigateToScreen('{{DATA:SCREEN:SCREEN_6}}'); } else { window.location.href='#criar-conta'; }" type="button" data-screen="{{DATA:SCREEN:SCREEN_6}}">
          Criar conta
        </button>
</div>
</form>
<!-- FORMULÁRIO DE CADASTRO (Criar conta) -->
<form class="w-full flex flex-col gap-space-sm hidden" id="form-register" onsubmit="event.preventDefault(); if (window.navigateToScreen) { navigateToScreen('{{DATA:SCREEN:SCREEN_6}}'); } else { window.location.href='#criar-conta'; }" data-screen="{{DATA:SCREEN:SCREEN_6}}">
<div class="flex flex-col gap-1">
<label class="font-body-medium text-label-caption-bold text-on-surface" for="reg-email">
          E-mail
        </label>
<input autocomplete="email" class="w-full h-11 px-3 bg-surface-container-lowest text-on-surface rounded placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-tertiary-fixed-dim" id="reg-email" name="email" placeholder="seu@email.com" required="" style="box-shadow: inset 0 0 0 1px #c3c4d2;" type="email">
</div>
<div class="flex flex-col gap-1">
<label class="font-body-medium text-label-caption-bold text-on-surface" for="reg-password">
          Senha de acesso
        </label>
<div class="relative flex items-center">
<input autocomplete="new-password" class="w-full h-11 pl-3 pr-10 bg-surface-container-lowest text-on-surface rounded placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-tertiary-fixed-dim" id="reg-password" name="password" placeholder="••••••••" required="" style="box-shadow: inset 0 0 0 1px #c3c4d2;" type="password">
<button aria-label="Alternar visibilidade da senha" class="absolute right-2 p-1 text-on-surface-variant hover:text-on-surface cursor-pointer rounded" onclick="togglePasswordVisibility('reg-password', 'reg-pwd-icon')" type="button">
<span class="material-symbols-outlined text-[20px]" id="reg-pwd-icon">visibility</span>
</button>
</div>
<p class="font-body-default text-label-caption text-on-surface-variant mt-0.5">
          (mínimo 8 caracteres, com letra e número)
        </p>
</div>
<div class="flex flex-col gap-1">
<label class="font-body-medium text-label-caption-bold text-on-surface" for="reg-password-confirm">
          Confirmar senha
        </label>
<input autocomplete="new-password" class="w-full h-11 px-3 bg-surface-container-lowest text-on-surface rounded placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-tertiary-fixed-dim" id="reg-password-confirm" name="password_confirm" placeholder="Repita sua senha" required="" style="box-shadow: inset 0 0 0 1px #c3c4d2;" type="password">
</div>
<button class="w-full min-h-[44px] mt-1 bg-primary-container hover:bg-primary text-on-primary font-body-bold text-body-bold rounded flex items-center justify-center transition-colors cursor-pointer shadow-sm active:scale-[0.99]" type="submit">
        Criar conta
      </button>
<div class="flex items-center justify-center gap-1.5 pt-2 text-center">
<span class="font-body-default text-label-caption text-on-surface-variant">Já tem uma conta?</span>
<button class="font-body-bold text-label-caption-bold text-primary hover:underline cursor-pointer" onclick="switchAuthMode('login')" type="button">
          Entrar
        </button>
</div>
</form>
<!-- Simulador de Estado de Erro para Avaliação -->
<div class="w-full mt-space-md pt-3 flex items-center justify-between border-t border-surface-container">
<span class="font-body-default text-label-caption text-outline">Simulador de status:</span>
<button class="font-body-medium text-label-caption px-2 py-1 rounded bg-surface-container text-on-surface-variant hover:bg-surface-container-high transition-colors cursor-pointer" onclick="toggleErrorAlert()" type="button">
        Alternar Mensagem de Erro
      </button>
</div>
</div>
</div>
<script>
  function switchAuthMode(mode) {
    const loginForm = document.getElementById('form-login');
    const registerForm = document.getElementById('form-register');
    const tabLoginBtn = document.getElementById('tab-login-btn');
    const tabRegisterBtn = document.getElementById('tab-register-btn');
    const errorAlert = document.getElementById('error-alert');

    // Fechar mensagem de erro em transição de tela
    if (errorAlert) {
      errorAlert.classList.add('hidden');
    }

    if (mode === 'login') {
      loginForm.classList.remove('hidden');
      registerForm.classList.add('hidden');

      tabLoginBtn.className = "py-2.5 px-space-xs text-center font-body-bold text-body-bold transition-all rounded text-on-primary bg-primary-container shadow-sm cursor-pointer focus-visible:outline focus-visible:outline-3 focus-visible:outline-tertiary-fixed-dim";
      tabLoginBtn.setAttribute('aria-selected', 'true');

      tabRegisterBtn.className = "py-2.5 px-space-xs text-center font-body-medium text-body-medium transition-all rounded text-on-surface-variant hover:text-on-surface cursor-pointer focus-visible:outline focus-visible:outline-3 focus-visible:outline-tertiary-fixed-dim";
      tabRegisterBtn.setAttribute('aria-selected', 'false');
    } else {
      loginForm.classList.add('hidden');
      registerForm.classList.remove('hidden');

      tabRegisterBtn.className = "py-2.5 px-space-xs text-center font-body-bold text-body-bold transition-all rounded text-on-primary bg-primary-container shadow-sm cursor-pointer focus-visible:outline focus-visible:outline-3 focus-visible:outline-tertiary-fixed-dim";
      tabRegisterBtn.setAttribute('aria-selected', 'true');

      tabLoginBtn.className = "py-2.5 px-space-xs text-center font-body-medium text-body-medium transition-all rounded text-on-surface-variant hover:text-on-surface cursor-pointer focus-visible:outline focus-visible:outline-3 focus-visible:outline-tertiary-fixed-dim";
      tabLoginBtn.setAttribute('aria-selected', 'false');
    }
  }

  function togglePasswordVisibility(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (!input || !icon) return;

    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      input.type = 'password';
      icon.textContent = 'visibility';
    }
  }

  function toggleErrorAlert() {
    const alertBox = document.getElementById('error-alert');
    if (alertBox) {
      alertBox.classList.toggle('hidden');
    }
  }

  function triggerAuthSim() {
    const alertBox = document.getElementById('error-alert');
    if (alertBox) {
      alertBox.classList.remove('hidden');
    }
  }

  function simulateRegister() {
    alert('Cadastro simulado com sucesso no Pyla!');
  }

  function toggleRecoveryModal() {
    alert('Instruções de redefinição enviadas para validação.');
  }
</script></main>

</body></html>
